# 주간 성적 리포트 — **수동 실행 전용** (즉석으로 리포트를 보고 싶을 때 Actions 탭에서 Run).
#
# 2026-07-26 구조 개선: 정기(7일) 발송은 price-check.yml 회차가 흡수했다
# (scripts/run_cycle.py 가 meta.last_weekly_report_at 을 보고 KST 09~22시 창에서 발송).
# 따라서 cron-job.org 에 주간 트리거를 등록할 필요가 **없다**. 이미 등록했다면 지워도 된다
# — 안 지워도 중복 발송만 생길 뿐 상태가 깨지지는 않는다(이 잡은 주기 meta 를 안 건드림).
#
# 읽기 전용 잡: data/levels.db 를 조회만 하고 쓰지 않으므로 상태 커밋 백 단계가 없다.
# 라이터는 price-check.yml 하나로 유지되어야 하므로 여기에 커밋 단계를 추가하지 말 것.
name: weekly-report

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: 주간 리포트 생성·발송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/run_weekly_report.py
