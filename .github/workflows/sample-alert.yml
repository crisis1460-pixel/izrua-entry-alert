# [일회용] 풀옵션 샘플 알림 1회 발송 — 2026-08-08 사용자 요청.
# 이 파일이 push 되면 1회 실행된다(로컬에 봇 토큰이 없어 러너의 Secrets 로
# 발송). 확인 후 scripts/send_sample_alert.py 와 함께 삭제 예정.
# 읽기 전용: data/ 를 건드리지 않는다(라이터는 price-check.yml 하나 유지).
name: sample-alert

on:
  push:
    paths:
      - ".github/workflows/sample-alert.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: 샘플 알림 발송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/send_sample_alert.py
