# 운영 회차 잡 — cron-job.org 가 2분마다 workflow_dispatch 로 트리거.
# 파일명은 유지한다(cron-job.org 에 등록된 dispatch 엔드포인트가 파일명 기준).
#
# ⚠️ 이 워크플로는 이 저장소에서 data/ 를 커밋하는 **유일한 라이터**다.
#
# 2026-07-26 구조 개선 — 왜 하나로 합쳤나:
#   collect(4h)와 price-check(2m)가 각자 data/levels.db 를 커밋하던 시절,
#   바이너리는 3-way 머지가 불가능해 두 잡의 커밋은 항상 충돌했고 rebase 전략
#   (-X ours / -X theirs)은 "누가 버려지나"만 정할 뿐이었다. 실제로 07-23~26 수집분이
#   전부 폐기됐다(26ac522). 라이터를 1개로 줄이면 충돌 경로 자체가 사라진다.
#   → 한 회차 = 가격체크(매번) + 수집(4h마다) + 주간 성적 리포트(7일마다).
#     주기 판정은 DB meta 키(last_collect_at / last_weekly_report_at)로 하고,
#     실패 격리·백오프는 scripts/run_cycle.py 참고.
name: price-check

on:
  # ── 백업 트리거 (2026-07-27 기획 카드 #2 과제1 — 기동 경로 이중화) ──────────
  # 주 경로는 여전히 cron-job.org(2분 주기, workflow_dispatch) - 이 설정은 무변경이다.
  # GH Actions 네이티브 schedule 은 "cron-job.org 가 완전히 죽어도(07-23~26 사고처럼
  # 3일간 아무도 모르게 수집이 멈추는 일) 최악의 경우 이 정도 주기로는 깨어난다"는
  # 최후 방어선일 뿐, 주 경로를 대체하지 않는다 - 절대 아래 이유로 "2분으로 당기자"고
  # 하지 말 것:
  #   1) GitHub 의 schedule 최소 간격 자체가 5분이다(그 아래는 등록도 안 된다).
  #   2) 실측·공식 문서 공통 — repo 활동이 적거나 GH 플랫폼이 바쁘면 지정 간격보다
  #      더 밀리거나(수십 분) 아예 스킵되는 회차도 있다. "정시 백업"을 전제로 설계하면
  #      안 된다.
  # concurrency(db-writer, cancel-in-progress:false)가 이미 있어 cron-job.org 트리거와
  # 겹쳐 들어와도 안전하게 직렬 대기할 뿐 데이터 손상 위험은 없다.
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      force_collect:
        description: "이번 실행에 수집을 강제(4시간 주기 무시)"
        type: boolean
        default: false
      force_report:
        description: "이번 실행에 주간 성적 리포트를 강제 발송"
        type: boolean
        default: false

permissions:
  contents: write  # data/ 상태 커밋 백
  actions: read    # 구버전 아티팩트 마이그레이션용

# 단일 라이터이므로 그룹도 하나. cancel-in-progress: false 가 핵심이다 —
# true 였다면 2분마다 오는 트리거가 진행 중인 5~8분짜리 수집 회차를 중도 취소해,
# 커밋백 전에 죽은 수집분이 통째로 유실된다. false 이므로 실행 중인 회차는 끝까지
# 보장되고, 겹쳐 들어온 트리거만 대기열에서 정리된다(가격체크는 1분봉 소급 판정이라
# 몇 회차 건너뛰어도 터치를 놓치지 않는다). 예전의 '수집 기아' 문제도 사라졌다 —
# 수집이 별도 대기열 항목이 아니라 실행되는 회차 안에 들어있기 때문이다.
concurrency:
  group: db-writer
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    # 가격체크만이면 ~1분, 수집 편입 회차는 5~8분. 수집에는 run_cycle 내부에서 12분
    # 하드 타임아웃이 걸려 있어 잡 타임아웃(20분)에 먼저 닿지 않는다.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: 구버전 아티팩트 마이그레이션 (data/ 에 DB 없을 때 1회만)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if [ -f data/levels.db ]; then
            echo "data/levels.db 존재 - 마이그레이션 불필요"
            exit 0
          fi
          ART_ID=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=50" \
            --jq '[.artifacts[] | select(.name=="bot-state" and .expired==false)] | sort_by(.created_at) | last | .id' || true)
          if [ -n "$ART_ID" ] && [ "$ART_ID" != "null" ]; then
            gh api "repos/${{ github.repository }}/actions/artifacts/$ART_ID/zip" > state.zip
            mkdir -p data && unzip -o state.zip -d data && rm state.zip
            echo "아티팩트 → data/ 마이그레이션 완료 (artifact $ART_ID)"
          else
            echo "이전 상태 없음 - 첫 회차가 수집부터 수행한다 (레벨 0개로 정상 종료)"
          fi

      # ── 실행 직전 data/ 최신화 (2026-07-28 중복알림 사고 수리) ──────────────
      # 왜 필요한가: 체크아웃과 이 잡의 실제 실행 사이에는 setup-python + pip
      # 설치까지 수십 초가 뜨는데, 앞 회차가 바로 그 사이에 push 하면 우리는
      # '앞 회차 이전' DB로 회차를 돈다. 그러면 앞 회차가 이미 보낸 터치·예고를
      # 상태 전이(status)로도, alerts_log 로도 볼 수 없어 같은 알림을 다시 보낸다.
      #   · 실측(07-28 03:53·03:54): DOT·ENA 터치와 AAVE 예고가 각각 두 번 발송.
      #   · 확정 증거: TV 차단 경보가 '하루 1회' 상한을 뚫고 두 번 나갔는데
      #     카운터(tv_block_alert_count)는 1 — 뒤 회차가 앞 회차 기록이 없는 DB를
      #     읽었다는 뜻이다.
      # 그래서 파이썬을 띄우기 '직전'에 원격 data/ 를 다시 당겨 창을 초 단위로 줄인다.
      # data/ 는 이 워크플로가 유일 라이터라 로컬에 살릴 변경이 없다 → 원격이 항상 옳다.
      # 실패해도 회차는 진행한다(구 상태로라도 도는 편이 낫고, 재발송은 alerts_log
      # 방어선이 한 겹 더 막는다 - monitor/price_check.py _RESEND_BLOCK_SEC).
      - name: data/ 최신 상태 재동기화
        run: |
          if git fetch origin "${{ github.ref_name }}" --depth=1 -q 2>/dev/null; then
            # ⚠️ 먼저 data/ 를 통째로 지운 뒤 체크아웃한다. `git checkout <tree> --
            # <path>` 는 **삭제를 전파하지 않기** 때문이다(git 고유 동작) - FETCH_HEAD
            # 에서 이미 지워진 파일이 작업트리에 그대로 남고 status 에도 안 잡혀,
            # 뒤이은 커밋백이 그 파일을 되살려 다시 커밋한다 → 감사 덤프 보존정책
            # (audit_dump_keep_weeks)이 경합 때마다 조용히 무력화된다.
            # (2026-07-28 개발자B 발견·재현.)
            #
            # `git clean -fd data/` 로는 못 고친다 - clean 은 **추적되지 않는** 파일만
            # 지우는데 이 파일은 우리 HEAD 기준으로 추적 중이라 그대로 남는다(실측
            # 확인). 아래 커밋백이 같은 함정을 rmtree+copytree 로 푼 것과 같은 해법이다.
            # data/ 는 이 워크플로가 유일 라이터라 지워서 잃을 로컬 변경이 없다.
            #
            # 단, 원격에 DB 가 아직 없는 **최초 부팅**은 건너뛴다. 이 스텝 바로 앞의
            # 아티팩트 마이그레이션이 방금 만들어놓은 data/ 를 지워버리면 그 회차가
            # 빈손으로 시작한다(구 아티팩트에서 복원한 상태가 통째로 증발).
            if ! git cat-file -e FETCH_HEAD:data/levels.db 2>/dev/null; then
              echo "::notice::원격에 DB 없음(최초 부팅) - 재동기화 건너뜀"
            else
              rm -rf data
              if git checkout FETCH_HEAD -- data/ 2>/dev/null; then
                echo "::notice::data/ 를 원격 최신으로 재동기화함(삭제 포함)"
              else
                # 방금 지웠으므로 반드시 되돌린다 - 인덱스(체크아웃 시점)에서 복구된다.
                echo "::error::data/ 체크아웃 실패 - 지운 data/ 를 되돌린다"
                git checkout -- data/ 2>/dev/null || true
              fi
              # 두 체크아웃이 모두 실패하면 data/ 가 통째로 사라진 채로 Python 이 돌아
              # 빈 DB 를 만든 뒤 커밋-백하는 최악의 시나리오를 차단한다.
              if [ ! -s data/levels.db ]; then
                echo "::error::data/levels.db 없음 또는 빈 파일 — 체크아웃 실패로 삭제된 것으로 추정, 안전하게 종료"
                exit 1
              fi
            fi
          else
            echo "::warning::fetch 실패 - 체크아웃 시점 상태로 진행"
          fi

      - name: 회차 실행 (가격체크 + 조건부 수집·주간리포트)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          WATCHER_GITHUB_TOKEN: ${{ secrets.WATCHER_GITHUB_TOKEN }}
          TV_COOKIE: ${{ secrets.TV_COOKIE }}
          # schedule 트리거(위 on.schedule)는 workflow_dispatch 가 아니라서 `inputs`
          # 컨텍스트가 채워지지 않는다 - inputs.force_collect 는 null 로 평가되고(GH
          # Actions 표현식은 없는 속성 접근을 에러 없이 null 로 처리), 그대로 두면 env
          # 값이 빈 문자열이 돼도 run_cycle.py 의 _env_flag() 가 빈 문자열/미설정을
          # 이미 False 로 취급하므로 실제로는 안전하다. 그래도 "빈 문자열"보다
          # "명시적 false" 가 읽기·디버깅에 낫고, 의도가 코드에 드러나야 하므로
          # `|| false` 로 한 번 더 방어한다 - workflow_dispatch 기본값(false)/사용자
          # 지정값 어느 쪽도 `true || false`/`false || false` 로 기존과 동일하게 평가돼
          # 수동 실행 동작은 전혀 바뀌지 않는다.
          FORCE_COLLECT: ${{ inputs.force_collect || false }}
          FORCE_REPORT: ${{ inputs.force_report || false }}
        run: python scripts/run_cycle.py

      # always(): 가격체크가 실패해도 그때까지 DB 에 쓰인 상태(수집분·터치 기록)는
      # 반드시 남긴다. 커밋하지 못하면 러너와 함께 통째로 사라진다.
      #
      # 2026-07-27 M3 수리 — commit-then-rebase 를 fetch-then-commit 으로 교체:
      #   예전 구조는 로컬 커밋을 먼저 만든 뒤 그 위에서 `git pull --rebase` 를
      #   재시도했다. data/levels.db 는 바이너리라 3-way 머지가 안 되므로, origin 이
      #   같은 파일을 건드린 경우 매 재시도가 "같은 지점"에서 결정적으로 재충돌했다
      #   (지수 백오프는 '경합'만 흡수할 뿐 '충돌'은 못 푼다 - 07-27 07:17~07:18
      #   실사고: 사람의 연속 수동 푸시 사이에서 그 회차의 data 커밋 자체가 이력에서
      #   증발했다). data/levels.db 는 델타가 아니라 매 회차가 끝난 시점의 전체
      #   스냅샷이므로, "로컬 커밋 없이 최신 origin 위에 스냅샷을 얹어 새로 커밋"하는
      #   쪽이 구조적으로 맞다 - 그러면 애초에 rebase 할 로컬 커밋이 없으니 충돌
      #   자체가 발생할 수 없다.
      - name: 상태 커밋 백 (변경 시에만)
        if: always()
        env:
          # push 6회 실패 시 텔레그램 경보를 쏘기 위해서만 쓴다(스텝 끝의 curl).
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -e
          git config user.name "izrua-bot"
          git config user.email "actions@users.noreply.github.com"

          if [ -z "$(git status --porcelain -- data/)" ]; then
            echo "상태 변경 없음"; exit 0
          fi

          # 커밋을 만들기 전에 이번 회차가 끝난 시점의 data/ 를 tmp 로 빼둔다 -
          # 이후 origin 을 따라가려고 로컬 HEAD 를 여러 번 움직여도(reset --hard)
          # 이 스냅샷은 워킹트리 밖에 있으므로 영향받지 않는다.
          SNAPSHOT_DIR="$(mktemp -d)"
          cp -r data/. "$SNAPSHOT_DIR/"
          BASE="$(git rev-parse HEAD)"

          # 2026-07-27 실전 장애(07:17:52·07:18:15 CTO 연속 수동 푸시) 이후에도
          # "경합 자체는 예외가 아니다"라는 원칙은 유지한다 - 봇이 2~30분마다 도는
          # 이상 순수 경합(다른 파일 변경, 혹은 같은 순간의 push 시도 충돌)은 상시
          # 조건이고 재시도로 흡수해야 한다. 6회 시도·지수 백오프 3→5→8→13→21초
          # (합 50초, fetch/push 자체 소요까지 더하면 총 60~90초권) - 회차 간격과
          # 잡 timeout(20분) 안에서 연속 푸시 몇 번을 흡수하되 다음 회차와 겹치지
          # 않을 상한을 90초 근방으로 둔다. 아래 루프는 6회 전부를 한 구조로
          # 돈다(예전처럼 "5회 루프 + 마지막 1회 별도 블록"으로 코드를 중복시키지
          # 않는다 - reset --hard 가 매 시도 시작을 항상 깨끗하게 만들어주므로
          # 별도 처리가 필요 없다).
          # 2026-07-27 수리(개발자B, 교차감사 m-A4 확정): fetch 도 push 와 같은 방식으로
          # 가드한다. set -e 아래에서 fetch 가 실패하면(네트워크 순단 등, exit 128)
          # 그 즉시 스크립트 전체가 죽어 6회 재시도가 첫 판에 통째로 증발한다 - 예전
          # (commit-then-rebase 시절) 구조는 pull 실패를 `|| { ...; continue; }` 로
          # 흡수했었는데, 이번 M3 구조 전환 때 그 방어가 빠진 채 회귀했다(A 실측 재현).
          # REMOTE/BASE 는 fetch 성공 이후에만 갱신 - 실패한 시도에서 이전 루프의
          # REMOTE/BASE 값을 건드리면 다음 시도가 잘못된 기준점으로 비교하게 된다.
          DELAYS=(3 5 8 13 21)
          for i in 0 1 2 3 4 5; do
            if ! git fetch -q origin main; then
              echo "::warning::git fetch 실패(네트워크 순단 추정, 시도 $((i+1))/6) - REMOTE/BASE 갱신 없이 재시도"
              if [ $i -lt 5 ]; then
                sleep "${DELAYS[$i]}"
              fi
              continue
            fi
            REMOTE="$(git rev-parse origin/main)"

            # ⚠️ 왜 무조건 ours(우리 스냅샷) 승리가 아닌가:
            # base 이후 origin 의 data/ 가 사람 손으로 바뀌었는데 우리 스냅샷으로
            # 덮으면 그 데이터가 조용히 유실된다. data/ 는 바이너리라 어느 쪽이
            # "옳은" 최신인지 자동 판단할 근거가 없으므로, 판단하지 않고 사람에게
            # 넘긴다.
            #
            # 다만 **바꾼 주체가 봇 자신이면 그건 정상 경합이다** (2026-07-27 저녁
            # 수리). 최초 설계는 "concurrency 가 직렬화하니 base 이후 data 변경은
            # 사람뿐"이라고 전제했는데 실측이 그 전제를 반박했다:
            #   · 19:32 KST 수집 회차(6~10분)가 도는 동안 2분 트리거가 밀려 쌓이고,
            #     끝나는 순간 한꺼번에 풀리며 회차가 겹쳤다(19:45:57·19:46:42 커밋이
            #     45초 간격 = 연달아 몰려 돈 흔적).
            #   · 그 구간에서만 실패가 났고(19:32~19:46), 앞뒤 26분은 2분 간격으로
            #     완벽히 정상이었다 → '사람 개입'이 아니라 봇끼리의 경합이 원인.
            #   · 결과: 4시간마다(수집 주기) 실패 메일 + 회차 몇 개 유실.
            # 그래서 '변경 여부'가 아니라 '변경한 사람'을 본다. 끼어든 data 커밋이
            # 전부 izrua-bot 이면 우리 스냅샷이 그 위에 얹혀도 안전하다 - 봇의
            # data/levels.db 는 델타가 아니라 **전체 스냅샷**이고, 우리 회차가 더
            # 나중이므로 우리 것이 상위집합이다(터치는 1분봉 소급 재검출로도 복원).
            # 한 명이라도 봇이 아니면 종전대로 멈춘다.
            if [ "$REMOTE" != "$BASE" ] && ! git diff --quiet "$BASE" "$REMOTE" -- data/; then
              if ! GIT_LOG_OUT="$(git log --format='%an' "$BASE".."$REMOTE" -- data/ 2>&1)"; then
                echo "::error::git log 실패(${GIT_LOG_OUT}) — 작성자 확인 불가, 안전하게 종료"
                exit 1
              fi
              OTHERS="$(printf '%s\n' "$GIT_LOG_OUT" | grep -v '^izrua-bot$' | sort -u || true)"
              if [ -n "$OTHERS" ]; then
                echo "::error::origin 의 data/ 가 base(${BASE}) 이후 **봇이 아닌 주체**에 의해 변경됨 - 자동 병합 위험 회피, 사람 확인 필요."
                echo "::error::변경 주체: ${OTHERS}"
                git log --oneline "$BASE".."$REMOTE" -- data/ || true
                exit 1
              fi
              echo "::notice::봇 자신의 선행 회차가 data/ 를 갱신함(정상 경합) - 최신 위에 이번 스냅샷을 얹는다"
            fi

            # data/ 는 base 이후 무변경(순수 경합이거나 첫 시도) - 로컬을 최신
            # origin 으로 맞추고 그 위에 스냅샷을 다시 얹는다. reset --hard 는 이전
            # 재시도에서 push 에 실패해 남은 로컬 커밋도 함께 정리해준다.
            #
            # ⚠️ 불변식(2026-07-27 수리, 개발자B, 교차감사 m-A8 확정): 이 reset --hard
            # 는 data/ 밖의 **추적 파일**에 대한 이번 회차 중 변경도 함께, 조용히
            # 되돌린다 - 위 스냅샷/복원은 data/ 만 다루므로 data/ 밖 변경은 애초에
            # 스냅샷에 없어 되살아나지 않는다. 지금은 "회차 실행" 스텝(python
            # scripts/run_cycle.py)의 산출물이 전부 data/ 밑이라 잠복해 있을
            # 뿐이다 - 이 잡의 파이썬 실행이 data/ 밖 추적 파일을 수정하게 되면
            # 이 스텝이 그 변경을 조용히 버린다. 산출물은 반드시 data/ 밑에 둘 것.
            git reset -q --hard "$REMOTE"
            BASE="$REMOTE"

            # data/ 를 스냅샷과 정확히 일치시킨다(추가·수정뿐 아니라 삭제도 반영 -
            # 예: 주간 감사 덤프 정리로 이번 회차에 지워진 파일이 위 reset 으로
            # 되살아난 채 남는 것을 막는다. git add 만으로는 "되살아난 뒤 그대로인"
            # 파일의 삭제를 표현할 수 없다).
            # 히어독(<<) 대신 -c 를 쓰는 이유: 히어독 종료 마커는 앞에 공백이
            # 있으면 안 되는데(POSIX 규칙), 이 블록은 YAML 리터럴 스칼라(|) 안이라
            # 모든 줄이 들여쓰기 돼야 한다 - 종료 마커만 들여쓰기를 뺄 수 없어
            # 두 요구가 충돌한다. -c "..." 는 그런 마커가 없어 이 문제를 피한다.
            # ⚠️ 위 reset 으로 작업트리에 올라온 **원격의 발송 원장**을 스냅샷 복원이
            # 덮기 전에 빼둔다. 아래 병합의 한쪽 입력이다.
            REMOTE_LEDGER="$(mktemp)"
            cp data/alerts_log.ndjson "$REMOTE_LEDGER" 2>/dev/null || : > "$REMOTE_LEDGER"

            python -c "
          import shutil, sys, pathlib
          snap = pathlib.Path(sys.argv[1])
          dst = pathlib.Path('data')
          if dst.exists():
              shutil.rmtree(dst)
          shutil.copytree(snap, dst)
          " "$SNAPSHOT_DIR"

            # 발송 원장만 '덮어쓰기'가 아니라 '합집합'으로 되돌린다 (2026-07-28).
            # 왜 이것만 특별대우인가: data/ 의 나머지(levels.db)는 매 회차의 전체
            # 스냅샷이라 최신 하나만 살아남으면 되지만, 원장은 **누가 무엇을 이미
            # 보냈는가**의 기록이라 어느 회차 것도 버릴 근거가 없다. 경합에서 진
            # 회차의 발송 기록이 사라지면 다음 회차가 그걸 모르고 재발송한다 —
            # 실측 사고(03:53 회차 기록이 03:54 회차 스냅샷에 덮여 영구 소실)가
            # 정확히 그 경로였다. 텍스트(NDJSON)로 뺀 이유도 이 병합을 가능하게
            # 하기 위함이다(바이너리 DB 안에 있으면 병합 자체가 불가능).
            # 병합 실패는 무시한다 - 원장은 보조 방어선이고, 이것 때문에 회차 상태
            # 커밋 자체가 막히면 손해가 더 크다.
            python -c "
          import sys, pathlib
          sys.path.insert(0, '.')
          from storage import alert_ledger
          out = 'data/alerts_log.ndjson'
          n = alert_ledger.merge_files(sys.argv[1], out, out_path=out)
          print(f'발송 원장 합집합 병합 - {n}줄')
          " "$REMOTE_LEDGER" || echo "::warning::발송 원장 병합 실패(무시) - 재발송 차단이 약해질 수 있음"
            rm -f "$REMOTE_LEDGER"

            git add data/
            if git diff --cached --quiet; then
              echo "상태 변경 없음(최신 origin 과 스냅샷이 동일)"
              exit 0
            fi
            git commit -q -m "data: cycle $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"

            if git push origin main; then
              exit 0
            fi

            if [ $i -lt 5 ]; then
              sleep "${DELAYS[$i]}"
            fi
          done

          # 2026-07-26 수리(카드2 과제3 계승): 여기서 exit 0 으로 끝내면 잡이
          # success(초록불)로 남아 이번 회차 상태가 유실됐는데도 아무도 모른다 -
          # 07-23~26 "전부 초록불인데 3일치 유실" 재발의 직접 원인이었다. ::error +
          # exit 1 로 실패를 표면화한다(터치 자체는 1분봉 소급 재검출로 다음 회차에
          # 복구되지만, push 실패는 사람이 반드시 인지해야 한다). 6회까지 늘린
          # 뒤에도 실패한다면 정상 경합 범위를 벗어난 지속 실패이므로 그대로 경보.
          echo "::error::상태 커밋 push 6회 실패 - 이번 회차 상태 유실 위험(터치는 1분봉 소급 재검출로 복구되나 push 실패는 확인 필요)"

          # 텔레그램으로도 알린다 (2026-07-28 개발자A 지적). ::error + 액션 실패
          # 메일만으로는 사장님께 사실상 신호가 가지 않는다 — 그 채널은 07-23~26
          # '사흘 침묵' 사고 때 이미 작동하지 않은 전력이 있다. 그리고 이 실패는
          # 남은 구멍 중 가장 나쁘다: **알림은 이미 나갔는데** 그 발송 기록이 통째로
          # 유실돼, 다음 회차가 같은 터치를 재검출해 **확정적으로 재발송**한다.
          # 사람이 즉시 알아야 하는 유일한 실패 모드다.
          # curl 실패는 무시한다(|| true) - 경보 발송 실패가 exit 1 을 가려선 안 된다.
          if [ -n "${TELEGRAM_BOT_TOKEN}" ] && [ -n "${TELEGRAM_CHAT_ID}" ]; then
            curl -sS -m 15 -o /dev/null \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=🚨 [상태 저장 실패] 회차 상태 커밋을 6회 시도 후에도 push 하지 못했습니다. 이번 회차 기록이 유실돼 같은 알림이 다시 갈 수 있습니다. GitHub Actions 로그를 확인해 주세요." \
              || true
          fi
          exit 1
