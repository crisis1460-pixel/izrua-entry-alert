# 보안 3차 방어선: 모든 push/PR 에서 비밀정보 스캔을 강제한다.
# 로컬 훅을 깜빡해도 GitHub 이 서버 측에서 한 번 더 막는다 — 걸리면 이 잡이 실패(빨간 X).
name: secret-scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 전체 히스토리도 검사 대상에 포함
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 커스텀 비밀정보 스캐너
        run: python scripts/check_secrets.py
      # 2026-08-03: gitleaks-action@v2 제거 — v2 는 공개 레포도 라이센스/rate-limit
      # 이슈로 잦은 오실패(매일 밤 push 러시 시각 secret-scan All jobs have failed
      # 이메일 반복). check_secrets.py 가 업비트키·텔레그램 토큰·GitHub PAT 등 우리
      # 프로젝트 실제 시크릿 유형을 모두 커버하고, 로컬 pre-commit 훅과 이 서버측
      # 스캐너 2겹으로 충분. 필요 시 gitleaks CLI 를 직접 다운로드해 실행하는 방식
      # (라이센스 무관)으로 전환 가능하지만 지금은 오버킬로 판단.
