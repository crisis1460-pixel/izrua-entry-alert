name: tests

# 2026-07-26 감사 MAJOR-3: push 에서 도는 잡이 secret-scan 하나뿐이라, 테스트가 깨진
# 코드도 서버 측에서 아무 저항 없이 배포 경로를 통과했다. 실제로 같은 날 파일 경계를
# 나눠 병렬 작업하던 중 한쪽이 배점을 바꾸자 반대쪽 테스트 14개가 red 가 됐는데
# (로컬에서 우연히 잡음), CI 는 그 사실을 알지 못했다.
#
# data/ 커밋백은 하지 않는다 — 이 레포의 DB 라이터는 price-check.yml 하나뿐이라는
# 불변식을 지켜야 한다(test_cycle.py W1 이 이를 검사한다).
on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'          # 봇이 2분마다 커밋하는 상태 파일 — 테스트와 무관
      - '**/*.md'
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true   # 연속 push 시 최신 것만 (봇 커밋은 위에서 이미 제외)

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"  # 2026-07-26 수리: price-check.yml/weekly-report.yml 과 일치
          cache: pip
      - run: pip install -r requirements.txt

      # 2026-09-28 최종안 #1: 테스트 **전부**(scripts/test_*.py 자동 수집) — 목록·판정은
      # scripts/run_tests.sh 한 곳에서(로컬과 동일). exit code 와 줄 머리 ❌ 를 둘 다 본다.
      # push 후 초록 확인 필수, 빨간불이면 30분 내 수리 또는 되돌림, 초록 전 다음 배포 금지.
      - name: 테스트 전체
        run: bash scripts/run_tests.sh

      - name: 비밀값 스캔
        run: python scripts/check_secrets.py
